name: Check and deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require a new release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$REF_NAME" = "refs/heads/main" ] && [ "$EVENT_NAME" = "push" ]; then
            base="$BEFORE_SHA"
          elif [ "$REF_NAME" = "refs/heads/main" ]; then
            base="HEAD^"
          else
            git fetch origin main
            base="origin/main"
          fi
          npm run check:version -- "$base"
      - run: npm ci
      - run: npm run check
        env:
          SAND_BUCKET_FULL_TESTS: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
